[package]
name = "context-prune"
version = "0.3.0"
edition = "2021"
description = "Token compression proxy for coding agents — sits between your agent and the LLM API, prunes redundant context, tracks token savings"
license = "MIT"
repository = "https://github.com/fuleinist/context-prune"
readme = "README.md"
keywords = ["llm", "tokens", "compression", "proxy", "agents"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.80"

[features]
default = ["skeleton"]
skeleton = ["dep:tree-sitter", "dep:tree-sitter-rust"]

[dependencies]
anyhow = "1"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1"
futures-util = "0.3"

[profile.release]
lto = "thin"
