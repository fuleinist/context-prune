[package]
name = "context-prune"
version = "0.1.0"
edition = "2021"
description = "Token compression proxy for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1"
futures-util = "0.3"

[profile.release]
lto = "thin"
